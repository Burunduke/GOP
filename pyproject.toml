[tool.poetry]
name = "gop-hyperspectral"
version = "2.0.0"
description = "Научная библиотека для гиперспектральной обработки и анализа растений"
readme = "README.md"
license = "MIT"
authors = [
    "Индыков Дмитрий Андреевич <indykovdm@example.com>"
]
maintainers = [
    "Индыков Дмитрий Андреевич <indykovdm@example.com>"
]
keywords = [
    "hyperspectral",
    "remote sensing",
    "vegetation indices",
    "orthophoto",
    "agriculture",
    "precision farming",
    "image segmentation",
    "plant analysis",
    "scientific computing",
    "гиперспектральная съемка",
    "вегетационные индексы",
    "ортофотоплан",
    "сельское хозяйство",
    "точное земледелие",
    "научные вычисления"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Agriculture",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Natural Language :: Russian"
]
repository = "https://github.com/indykovdm/GOP"
documentation = "https://github.com/indykovdm/GOP/wiki"
homepage = "https://github.com/indykovdm/GOP"

[tool.poetry.dependencies]
python = "^3.9"

# Основные научные библиотеки
numpy = [
    {version = ">=1.24.0,<2.0.0", python = "<3.12"},
    {version = ">=1.26.0,<2.0.0", python = ">=3.12"}
]
scipy = ">=1.10.0,<2.0.0"
matplotlib = ">=3.7.0,<4.0.0"
pandas = ">=2.0.0,<3.0.0"

# Обработка изображений и машинное обучение
scikit-image = ">=0.20.0,<1.0.0"
scikit-learn = ">=1.3.0,<2.0.0"
opencv-python = ">=4.7.0,<5.0.0"
torch = ">=2.0.0,<3.0.0"
torchvision = ">=0.15.0,<1.0.0"
Pillow = ">=9.0.0,<11.0.0"

# Геоданные и ГИС
gdal = ">=3.7.0,<4.0.0"
rasterio = ">=1.3.0,<2.0.0"
geopandas = ">=0.13.0,<1.0.0"
fiona = ">=1.9.0,<2.0.0"
pyproj = ">=3.5.0,<4.0.0"

# Гиперспектральная обработка
spectral = ">=0.22.4"

# Визуализация
seaborn = ">=0.12.0,<1.0.0"
plotly = ">=5.15.0,<6.0.0"

# Обработка сигналов и вейвлеты
pywavelets = ">=1.4.0,<2.0.0"

# Работа с большими данными
xarray = ">=2023.1.0,<2024.0.0"
dask = ">=3.0.0,<2024.0.0"

# Конфигурация и утилиты
pyyaml = ">=6.0,<7.0.0"
tqdm = ">=4.65.0,<5.0.0"

# GUI зависимости
dash = ">=2.14.0,<3.0.0"
dash-bootstrap-components = ">=1.5.0,<2.0.0"
flask = ">=2.3.0,<3.0.0"

# Базы данных и кэширование
sqlalchemy = ">=2.0.0,<3.0.0"
redis = ">=4.5.0,<5.0.0"

# Асинхронная обработка
celery = ">=5.3.0,<6.0.0"

# Веб-сервер
gunicorn = ">=21.0.0,<22.0.0"
waitress = ">=2.1.0,<3.0.0"

# Безопасность и валидация
werkzeug = ">=2.3.0,<3.0.0"
email-validator = ">=2.0.0,<3.0.0"

# Дополнительные утилиты
python-dotenv = ">=1.0.0,<2.0.0"
python-multipart = ">=0.0.6,<1.0.0"
aiofiles = ">=23.0.0,<24.0.0"
httpx = ">=0.24.0,<1.0.0"

# База данных для продакшена
psycopg2-binary = ">=2.9.0,<3.0.0"

[tool.poetry.group.dev.dependencies]
# Тестирование
pytest = ">=7.4.0,<8.0.0"
pytest-cov = ">=4.1.0,<5.0.0"
pytest-mock = ">=3.10.0,<4.0.0"
pytest-xdist = ">=3.0.0,<4.0.0"

# Форматирование и линтинг
black = ">=23.0.0,<24.0.0"
flake8 = ">=6.0.0,<7.0.0"
isort = ">=5.12.0,<6.0.0"
pylint = ">=2.17.0,<3.0.0"
mypy = ">=1.0.0,<2.0.0"

# Документация
sphinx = ">=7.0.0,<8.0.0"
sphinx-rtd-theme = ">=1.2.0,<2.0.0"
sphinx-autodoc-typehints = ">=1.24.0,<2.0.0"

# Pre-commit хуки
pre-commit = ">=3.0.0,<4.0.0"

# Профилирование
memory-profiler = ">=0.61.0,<1.0.0"
line-profiler = ">=4.1.0,<5.0.0"

# Безопасность
bandit = ">=1.7.5,<2.0.0"
safety = ">=2.3.0,<3.0.0"
pip-audit = ">=2.5.0,<3.0.0"

# Утилиты для анализа зависимостей
pipdeptree = ">=2.13.0,<3.0.0"

# Типы для mypy
types-PyYAML = ">=6.0.0,<7.0.0"
types-requests = ">=2.31.0,<3.0.0"

[tool.poetry.group.gpu.dependencies]
# GPU зависимости (только для Linux/Windows)
cupy-cuda11x = {version = ">=12.0.0,<13.0.0", platform = "linux"}

[tool.poetry.group.gui.dependencies]
# Дополнительные GUI зависимости
PyQt6 = ">=6.4.0,<7.0.0"

[tool.poetry.group.cloud.dependencies]
# Облачные хранилища
boto3 = ">=1.26.0,<2.0.0"
google-cloud-storage = ">=2.7.0,<3.0.0"
azure-storage-blob = ">=12.14.0,<13.0.0"

[tool.poetry.scripts]
gop = "main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# Настройки инструментов
[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["gop"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "cv2.*",
    "gdal.*",
    "osgeo.*",
    "spectral.*",
    "sklearn.*",
    "torch.*",
    "torchvision.*"
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests"
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "setup.py"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:"
]

[tool.bandit]
exclude_dirs = ["tests", "build", "dist"]
skips = ["B101", "B601"]