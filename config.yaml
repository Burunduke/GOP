# GOP Scientific Configuration - Hyperspectral Processing and Plant Analysis
# Version 2.0.0 - Clean Scientific Architecture with GUI Integration

# Data Processing
processing:
  max_image_size: 15000           # Maximum image size in pixels
  compression_ratio: 0.125        # Compression ratio for intermediate files
  batch_size: 32                  # Processing batch size
  num_workers: 4                  # Number of parallel workers
  orthophoto_resolution: 0.05     # Orthophoto resolution in meters
  dem_resolution: 0.1             # DEM resolution in meters
  feature_quality: "high"         # Feature extraction quality
  matcher_neighbors: 8            # Number of neighbors for feature matching
  odm_timeout: 7200               # OpenDroneMap timeout in seconds (2 hours)
  
  # Orthophoto output settings
  orthophoto:
    output:
      compression: LZW       # LZW | DEFLATE | NONE
      predictor: auto        # auto | 1 | 2 | 3
      tiled: true
      block_size: 512
      bigtiff: IF_SAFER
      target_dtype: uint8    # uint8 | preserve
      build_overviews: true
      overview_levels: [2, 4, 8, 16]
    blend:
      enabled: true            # if false, fall back to "last image wins" old behavior
      method: feather          # feather (distance-transform) is the only method for now
      feather_distance_px: 0   # 0 = use full distance transform; >0 = clamp weights at this px distance
      input_nodata: 0          # 0 | null (disable) | "alpha" (use alpha band)
      edge_erosion_px: 2       # erode valid mask by N pixels before distance transform; 0 disables
    stitching_method: gdal     # gdal | opencv | odm
    opencv:
      detector: auto         # auto | sift | orb
      ratio_test: 0.75
      ransac_reproj_threshold: 5.0
      min_matches: 10
      try_use_gpu: false     # passed to cv2.Stitcher_create if supported
   
  # Scientific processing parameters
  radiometric_correction:
    method: "empirical_line"        # dark_current, empirical_line, flat_field
    dark_percentile: 1              # Percentile for dark pixel detection
    bright_percentile: 99           # Percentile for bright pixel detection
  
  atmospheric_correction:
    enabled: true
    method: "simplified"  # simplified, empirical_line, modtran
  
  noise_reduction:
    method: "pca"                   # pca, mnf, wavelet, savgol
    n_components: 0.95              # PCA components ratio
    wavelet_type: "db4"             # Wavelet type for wavelet denoising
    wavelet_levels: 2               # Wavelet decomposition levels
    savgol_window: 11               # Savitzky-Golay window size
    savgol_polyorder: 3             # Savitzky-Golay polynomial order
    
  spectral_calibration:
    enabled: true
    resampling: true
    smoothing: true
    standard_ranges:
      blue: [450, 495]
      green: [495, 570]
      red: [620, 750]
      red_edge: [700, 780]
      nir: [750, 1400]
      swir1: [1400, 1800]
      swir2: [2000, 2500]


# Output Results
output:
  results_dir: "results"          # Output directory for results
  save_intermediate: true         # Save intermediate processing files
  output_format: "GeoTIFF"        # Output file format
  
  scientific_reports:
    enabled: true
    format: "json"                # json, csv, excel
    include_statistics: true      # Include statistical analysis
    include_correlations: true    # Include correlation matrices
    include_spatial_analysis: true # Include spatial analysis

# Logging
logging:
  level: "INFO"                   # DEBUG, INFO, WARNING, ERROR, CRITICAL
  file: "logs/gop.log"           # Log file path
  max_size: "10MB"               # Maximum log file size
  backup_count: 5                 # Number of backup files
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# Performance
performance:
  memory:
    max_memory_usage: "8GB"       # Maximum memory usage
    chunk_size: 1024              # Processing chunk size
    memory_mapping: true          # Use memory mapping for large files
  
  parallel:
    enabled: true                 # Enable parallel processing
    max_workers: 4                # Maximum parallel workers
    chunk_processing: true        # Process data in chunks
  
  cache:
    enabled: true                 # Enable caching
    cache_dir: "cache"            # Cache directory
    max_cache_size: "1GB"         # Maximum cache size
    max_memory_entries: 100       # Maximum memory entries
    ttl: 3600                     # Time to live in seconds (1 hour)
    cleanup_interval: 86400       # Cache cleanup interval (24 hours)
    compression: true             # Enable cache compression
    stats_enabled: true           # Enable cache statistics

# Validation and Quality Control
validation:
  enabled: true
  
  # Data validation
  data_validation:
    check_missing_values: true
    check_outliers: true
    check_spectral_consistency: true
    min_snr: 10
  
  # Result validation
  result_validation:
    check_georeference: true
    check_projection: true
    check_data_range: true
    check_nodata_values: true

# External Tools Integration
external_tools:
  # OpenDroneMap
  opendronemap:
    enabled: true
    auto_detect: true
    fallback_to_gdal: true
  
  # GDAL
  gdal:
    config_options:
      GDAL_CACHEMAX: "512"
      GDAL_DATA: "/usr/share/gdal"
      CPL_DEBUG: "OFF"

# Experimental Features
experimental:
  enabled: false
  
  # Machine Learning
  machine_learning:
    enabled: false
    auto_classification: false
    anomaly_detection: false
  
  # Cloud Processing
  cloud_processing:
    enabled: false
    provider: "aws"  # aws, gcp, azure
    auto_scaling: false

# Metadata
metadata:
  project_name: "GOP - Hyperspectral Processing and Orthophoto Creation"
  version: "2.0.0"
  description: "Library for hyperspectral data loading and orthophoto creation"
  authors:
    - "Dmitry Indykov"
  
  # Contact information
  contact:
    email: "indykovdm@example.com"
    repository: "https://github.com/indykovdm/GOP"