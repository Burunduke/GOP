# GOP Scientific Configuration - Hyperspectral Processing and Plant Analysis
# Version 2.0.0 - Clean Scientific Architecture with GUI Integration

# Data Processing
processing:
  max_image_size: 15000
  compression_ratio: 0.125
  batch_size: 32
  num_workers: 4
  orthophoto_resolution: 0.05
  dem_resolution: 0.1
  feature_quality: "high"
  matcher_neighbors: 8
  odm_timeout: 7200  # 2 hours
  
  # Scientific processing parameters
  radiometric_correction:
    method: "empirical_line"  # dark_current, empirical_line, flat_field
    dark_percentile: 1
    bright_percentile: 99
  
  atmospheric_correction:
    enabled: true
    method: "simplified"  # simplified, empirical_line, modtran
  
  noise_reduction:
    method: "pca"  # pca, mnf, wavelet, savgol
    n_components: 0.95
    wavelet_type: "db4"
    wavelet_levels: 2
    savgol_window: 11
    savgol_polyorder: 3
  
  spectral_calibration:
    enabled: true
    resampling: true
    smoothing: true
    standard_ranges:
      blue: [450, 495]
      green: [495, 570]
      red: [620, 750]
      red_edge: [700, 780]
      nir: [750, 1400]
      swir1: [1400, 1800]
      swir2: [2000, 2500]


# Output Results
output:
  results_dir: "results"
  save_intermediate: true
  output_format: "GeoTIFF"
  
  # Visualization
  visualization:
    enabled: true
    format: "png"  # png, pdf, svg
    dpi: 300
    colormap: "viridis"

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  file: "logs/gop.log"
  max_size: "10MB"
  backup_count: 5
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# Performance
performance:
  # Memory
  memory:
    max_memory_usage: "8GB"
    chunk_size: 1024
    memory_mapping: true
  
  # Parallel processing
  parallel:
    enabled: true
    max_workers: 4
    chunk_processing: true
  
  # Caching
  cache:
    enabled: true
    cache_dir: "cache"
    max_cache_size: "1GB"
    max_memory_entries: 100
    ttl: 3600  # 1 hour
    cleanup_interval: 86400  # 24 hours
    compression: true
    stats_enabled: true

# Validation and Quality Control
validation:
  enabled: true
  
  # Data validation
  data_validation:
    check_missing_values: true
    check_outliers: true
    check_spectral_consistency: true
    min_snr: 10
  
  # Result validation
  result_validation:
    check_georeference: true
    check_projection: true
    check_data_range: true
    check_nodata_values: true

# External Tools Integration
external_tools:
  # OpenDroneMap
  opendronemap:
    enabled: true
    auto_detect: true
    fallback_to_gdal: true
  
  # GDAL
  gdal:
    config_options:
      GDAL_CACHEMAX: "512"
      GDAL_DATA: "/usr/share/gdal"
      CPL_DEBUG: "OFF"

# Experimental Features
experimental:
  enabled: false
  
  # Machine Learning
  machine_learning:
    enabled: false
    auto_classification: false
    anomaly_detection: false
  
  # Cloud Processing
  cloud_processing:
    enabled: false
    provider: "aws"  # aws, gcp, azure
    auto_scaling: false

# Metadata
metadata:
  project_name: "GOP - Hyperspectral Processing and Orthophoto Creation"
  version: "2.0.0"
  description: "Library for hyperspectral data loading and orthophoto creation"
  authors:
    - "Dmitry Indykov"
  
  # Contact information
  contact:
    email: "indykovdm@example.com"
    repository: "https://github.com/indykovdm/GOP"