# GOP Scientific Configuration - Hyperspectral Processing and Plant Analysis
# Version 2.0.0 - Clean Scientific Architecture with GUI Integration

# Data Processing
processing:
  max_image_size: 15000
  compression_ratio: 0.125
  batch_size: 32
  num_workers: 4
  orthophoto_resolution: 0.05
  dem_resolution: 0.1
  feature_quality: "high"
  matcher_neighbors: 8
  odm_timeout: 7200  # 2 hours
  
  # Scientific processing parameters
  radiometric_correction:
    method: "empirical_line"  # dark_current, empirical_line, flat_field
    dark_percentile: 1
    bright_percentile: 99
  
  atmospheric_correction:
    enabled: true
    method: "simplified"  # simplified, empirical_line, modtran
  
  noise_reduction:
    method: "pca"  # pca, mnf, wavelet, savgol
    n_components: 0.95
    wavelet_type: "db4"
    wavelet_levels: 2
    savgol_window: 11
    savgol_polyorder: 3
  
  spectral_calibration:
    enabled: true
    resampling: true
    smoothing: true
    standard_ranges:
      blue: [450, 495]
      green: [495, 570]
      red: [620, 750]
      red_edge: [700, 780]
      nir: [750, 1400]
      swir1: [1400, 1800]
      swir2: [2000, 2500]

# Image Segmentation
segmentation:
  model_path: "models/segmentation/best_deeplabv3plus_resnet50_voc_os16.pth"
  device: "auto"  # auto, cpu, cuda
  confidence_threshold: 0.5
  
  # Cascade segmentation parameters
  cascade_psp:
    enabled: true
    l_parameter: 500  # L parameter for CascadePSP
    refinement_threshold: 0.7
  
  # Scientific quality assessment parameters
  quality_metrics:
    iou_threshold: 0.5
    dice_threshold: 0.5
    boundary_precision: 0.8

# Vegetation Indices
indices:
  sensor_types: ["RGB", "Multispectral", "Hyperspectral"]
  
  # Scientific index classification
  index_groups:
    greenness: ["GNDVI", "MCARI", "MNLI", "OSAVI", "TVI", "NDVI"]
    stress: ["SIPI2", "mARI", "PRI", "CRI"]
    water: ["NDWI", "MSI", "WI", "NDII"]
    pigment: ["CARI", "PSRI", "SIPI"]
    structure: ["MSR", "MSAVI", "TVI"]
  
  default_indices: [
    "GNDVI", "MCARI", "MNLI", "OSAVI", "TVI",
    "SIPI2", "mARI", "NDWI", "MSI"
  ]
  
  # Spectral channels for different sensors
  sensor_bands:
    RGB:
      Blue: 0
      Green: 1
      Red: 2
    
    Multispectral:
      Blue: 0
      Green: 1
      Red: 2
      RedEdge: 3
      NIR: 4
    
    Hyperspectral:
      Blue: 10    # ~450 nm
      Green: 20   # ~550 nm
      Red: 30     # ~650 nm
      RedEdge: 35 # ~720 nm
      NIR: 50     # ~800 nm
      SWIR: 80    # ~1600 nm

# Scientific Analysis
scientific_analysis:
  enabled: true
  
  # Statistical analysis
  statistics:
    confidence_level: 0.95
    outlier_detection: true
    outlier_method: "iqr"  # iqr, zscore, isolation_forest
  
  # Correlation analysis
  correlation:
    method: "pearson"  # pearson, spearman, kendall
    threshold: 0.7
    significance_test: true
  
  # Spatial analysis
  spatial:
    morans_i: true
    hotspot_analysis: true
    fragmentation_index: true
    spatial_autocorrelation: true
  
  # Plant condition classification
  classification:
    method: "threshold"  # threshold, clustering, ml
    thresholds:
      excellent: 0.8
      good: 0.6
      satisfactory: 0.4
      poor: 0.0

# Output Results
output:
  results_dir: "results"
  save_intermediate: true
  output_format: "GeoTIFF"
  
  # Scientific reports
  scientific_reports:
    enabled: true
    format: "json"  # json, csv, excel
    include_statistics: true
    include_correlations: true
    include_spatial_analysis: true
  
  # Visualization
  visualization:
    enabled: true
    format: "png"  # png, pdf, svg
    dpi: 300
    colormap: "viridis"
    
    # Visualization types
    types:
      index_maps: true
      condition_maps: true
      correlation_matrices: true
      spatial_patterns: true
      histograms: true

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  file: "logs/gop.log"
  max_size: "10MB"
  backup_count: 5
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  
  # Scientific logging
  scientific_logging:
    enabled: true
    log_processing_steps: true
    log_quality_metrics: true
    log_performance_metrics: true

# Performance
performance:
  # Memory
  memory:
    max_memory_usage: "8GB"
    chunk_size: 1024
    memory_mapping: true
  
  # Parallel processing
  parallel:
    enabled: true
    max_workers: 4
    chunk_processing: true
  
  # Caching
  cache:
    enabled: true
    cache_dir: "cache"
    max_cache_size: "1GB"
    max_memory_entries: 100
    ttl: 3600  # 1 hour
    cleanup_interval: 86400  # 24 hours
    compression: true
    stats_enabled: true

# Validation and Quality Control
validation:
  enabled: true
  
  # Data validation
  data_validation:
    check_missing_values: true
    check_outliers: true
    check_spectral_consistency: true
    min_snr: 10
  
  # Result validation
  result_validation:
    check_georeference: true
    check_projection: true
    check_data_range: true
    check_nodata_values: true

# External Tools Integration
external_tools:
  # OpenDroneMap
  opendronemap:
    enabled: true
    auto_detect: true
    fallback_to_gdal: true
  
  # GDAL
  gdal:
    config_options:
      GDAL_CACHEMAX: "512"
      GDAL_DATA: "/usr/share/gdal"
      CPL_DEBUG: "OFF"

# Experimental Features
experimental:
  enabled: false
  
  # Machine Learning
  machine_learning:
    enabled: false
    auto_classification: false
    anomaly_detection: false
  
  # Cloud Processing
  cloud_processing:
    enabled: false
    provider: "aws"  # aws, gcp, azure
    auto_scaling: false

# Metadata
metadata:
  project_name: "GOP - Hyperspectral Processing and Plant Analysis"
  version: "2.0.0"
  description: "Scientific library for hyperspectral data processing and plant condition analysis"
  authors:
    - "Dmitry Indykov"
  
  # Scientific references
  references:
    - "Mitrofanov E.P., Petrushin A.F. Use of aerial photography data for precision agricultural practices"
    - "Chen L. et al. Rethinking Atrous Convolution for Semantic Image Segmentation"
    - "CascadePSP: Toward Class-Agnostic and Very High-Resolution Segmentation via Global and Local Refinement"
  
  # Contact information
  contact:
    email: "indykovdm@example.com"
    repository: "https://github.com/indykovdm/GOP"